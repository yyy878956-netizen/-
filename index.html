<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="楽単一覧">
<meta name="theme-color" content="#4b3f9e">

<style>
:root{
  --purple:#4b3f9e; --green:#c8e6c9; --greenText:#2e7d32;
  --yellow:#fff9c4; --yellowText:#8a6d00;
  --red:#f6c6c6; --redText:#a02c2c;
  --bg:#ffffff; --fg:#222222; --panel:#f4f4fa; --border:#c9c9d6; --muted:#666;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Meiryo",sans-serif;padding:16px;}
h1{font-size:1.25rem;margin:0 0 4px;}
p.sub{color:var(--muted);margin:0 0 14px;font-size:.85rem;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px;}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
select,input[type=text],textarea{padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:.9rem;font-family:inherit;}
input[type=text]{flex:1;min-width:140px;}
button{padding:8px 14px;border-radius:6px;border:none;background:var(--purple);color:#fff;font-size:.9rem;cursor:pointer;}
button.secondary{background:#888;}
button.danger{background:#c0392b;padding:4px 8px;font-size:.75rem;}
ul#entryList{list-style:none;margin:0;padding:0;max-height:180px;overflow-y:auto;}
ul#entryList li{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border);font-size:.85rem;}
.tag{padding:2px 6px;border-radius:4px;font-size:.75rem;font-weight:bold;margin-left:6px;}
.tag.楽{background:var(--green);color:var(--greenText);}
.tag.準楽{background:var(--yellow);color:var(--yellowText);}
.tag.厳単{background:var(--red);color:var(--redText);}
table#grid{border-collapse:collapse;width:100%;table-layout:fixed;}
table#grid th{background:var(--purple);color:#fff;padding:8px 2px;font-size:.85rem;}
table#grid td{border:1px solid var(--border);vertical-align:top;padding:0;height:80px;}
.periodCell{background:var(--panel);text-align:center;font-size:.75rem;padding:6px 2px;width:64px;}
.periodCell b{display:block;font-size:.9rem;}
.entryBlock{padding:4px;font-size:.72rem;text-align:center;border-bottom:1px solid rgba(0,0,0,.08);cursor:pointer;}
.entryBlock.楽{background:var(--green);color:var(--greenText);}
.entryBlock.準楽{background:var(--yellow);color:var(--yellowText);}
.entryBlock.厳単{background:var(--red);color:var(--redText);}
.wrap{overflow-x:auto;}
.footerNote{color:var(--muted);font-size:.7rem;margin-top:10px;}
textarea#shareBox{width:100%;height:70px;font-size:.75rem;}
details{margin-top:10px;}
#modalOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:16px;}
#modalOverlay.open{display:flex;}
#modalBox{background:var(--bg);border-radius:12px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;}
#modalBox h3{margin:0 0 4px;font-size:1.05rem;}
#modalBox .modalTag{font-size:.75rem;margin-bottom:12px;}
#modalBox label{display:block;font-size:.8rem;font-weight:bold;margin:10px 0 4px;color:var(--muted);}
#modalBox textarea{width:100%;min-height:60px;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--fg);font-size:.85rem;}
#modalBox .modalRow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
@media print{
  @page{ size: landscape; margin:10mm; }
  .no-print{display:none !important;}
  body{padding:0;}
  table#grid td{height:90px;}
}
</style>
</head>
<body>
<h1>らくらく履修コマ一覧（閲覧版）</h1>
<p class="sub">タップすると各授業の良いところ・悪いところが見られます。</p>


<div class="wrap">
<table id="grid">
  <thead><tr><th style="width:64px;"></th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr></thead>
  <tbody id="gridBody"></tbody>
</table>
</div>
<p class="footerNote">※記載は履修者の主観的な感想に基づく参考情報です。年度・担当教員により変わる場合があります。</p>

<div id="modalOverlay" class="no-print">
  <div id="modalBox">
    <h3 id="modalTitle"></h3>
    <div class="modalTag" id="modalTag"></div>
    <label>良いところ</label>
    <textarea id="modalPros" placeholder="（記入なし）" disabled></textarea>
    <label>悪いところ</label>
    <textarea id="modalCons" placeholder="（記入なし）" disabled></textarea>
    <div class="modalRow">
      <button class="secondary" id="modalClose">閉じる</button>
    </div>
  </div>
</div>

<script>
const days=["月","火","水","木","金","土"];
const periods=[["1限","09:00-10:40"],["2限","10:50-12:30"],["3限","13:30-15:10"],["4限","15:20-17:00"],["5限","17:10-18:50"]];
let entries=[
  {day:"火",period:1,name:"法と心理",level:"楽"},
  {day:"火",period:1,name:"ドイツ文化",level:"準楽"},
  {day:"木",period:1,name:"経済学",level:"楽"},
  {day:"金",period:2,name:"フランス語圏文化",level:"楽"},
  {day:"水",period:1,name:"科学と技術",level:"準楽"},
  {day:"水",period:2,name:"映像リテラシー",level:"楽"},
  {day:"火",period:3,name:"アジア文化",level:"楽"},
  {day:"木",period:1,name:"心理学",level:"楽"},
  {day:"水",period:4,name:"法と言語",level:"楽"},
  {day:"火",period:2,name:"アジア文化(京劇)",level:"楽"},
  {day:"月",period:3,name:"イスラーム文化",level:"準楽"},
  {day:"水",period:0,name:"スポ社",level:"準楽"},
  {day:"月",period:1,name:"倫理学",level:"楽"}
];

function load(){
  try{
    const raw=localStorage.getItem("easyTimetableEntries");
    if(raw) entries=JSON.parse(raw);
  }catch(e){}
}
function save(){ try{ localStorage.setItem("easyTimetableEntries", JSON.stringify(entries)); }catch(e){} }

function renderAll(){ renderGrid(); }
function renderGrid(){
  const tbody=document.getElementById("gridBody");
  tbody.innerHTML="";
  periods.forEach((p,pIdx)=>{
    const tr=document.createElement("tr");
    const pcell=document.createElement("td");
    pcell.className="periodCell";
    pcell.innerHTML=`<b>${p[0]}</b>${p[1]}`;
    tr.appendChild(pcell);
    days.forEach(d=>{
      const td=document.createElement("td");
      entries.filter(e=>e.day===d && e.period===pIdx).forEach(ce=>{
        const div=document.createElement("div");
        div.className="entryBlock "+ce.level;
        div.textContent=`${ce.name}【${ce.level}】`;
        if(ce.pros || ce.cons) div.textContent += " 📝";
        div.onclick=()=>openModal(ce);
        td.appendChild(div);
      });
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

let modalEntry=null;
function openModal(entry){
  modalEntry=entry;
  document.getElementById("modalTitle").textContent=`${entry.day} ${periods[entry.period][0]}：${entry.name}`;
  document.getElementById("modalTag").innerHTML=`<span class="tag ${entry.level}">${entry.level}</span>`;
  document.getElementById("modalPros").value=entry.pros||"（記入なし）";
  document.getElementById("modalCons").value=entry.cons||"（記入なし）";
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal(){
  document.getElementById("modalOverlay").classList.remove("open");
  modalEntry=null;
}
document.getElementById("modalClose").onclick=closeModal;
document.getElementById("modalOverlay").onclick=(e)=>{ if(e.target.id==="modalOverlay") closeModal(); };

load(); renderAll();
</script>
</body>
</html>
